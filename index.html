<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iStore - Chuyên iPhone Chính Hãng</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Thanh điều hướng -->
    <header class="navbar">
      <div class="container nav-content">
        <a href="#" class="logo">
          <svg
            class="apple-icon"
            viewBox="0 0 170 170"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.13-1.9-14.34-6.08-3.69-3.03-7.61-7.8-11.77-14.32-5.05-7.92-9.22-17.1-12.51-27.55-3.29-10.45-4.94-20.17-4.94-29.15 0-11.32 2.82-20.66 8.46-28.02 5.64-7.36 12.72-11.15 21.24-11.37 4.12 0 9.02 1.27 14.7 3.81 5.68 2.54 9.33 3.83 10.95 3.87 1.27 0 5.33-1.51 12.18-4.53 6.85-3.02 12.63-4.32 17.34-3.9 12.88 1.04 22.56 6.13 29.04 15.27-11.53 6.99-17.21 16.78-17.04 29.37.17 9.83 3.82 18.01 10.95 24.54 4.92 4.53 10.56 7.51 16.92 8.94-1.36 4.12-2.82 8.1-4.38 11.94zM119.22 32.9c0 7.77-2.84 15.02-8.52 21.75-6.85 8.01-15.14 12.63-24.12 11.91-.11-.95-.17-1.99-.17-3.12 0-7.46 3.25-15.42 9.03-21.93 2.89-3.26 6.55-5.97 10.98-8.13 4.43-2.16 8.61-3.36 12.54-3.6.17 1.08.26 2.12.26 3.12z"
            />
          </svg>
          <span>iStore</span>
        </a>

        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm iPhone (VD: 16 Pro Max, 15, 14...)"
          />
        </div>

        <button class="cart-btn" onclick="toggleCart()">
          Giỏ hàng (<span id="cartCount">0</span>)
        </button>
      </div>
    </header>

    <!-- Banner đơn giản -->
    <section class="hero">
      <div class="container">
        <h1>Chọn chiếc iPhone dành cho bạn.</h1>
        <p>Thiết kế tinh tế. Hiệu năng vượt trội. Giao hàng tận nơi.</p>
      </div>
    </section>

    <!-- Danh sách sản phẩm -->
    <main class="container">
      <div id="productGrid" class="product-grid">
        <!-- Sản phẩm sẽ được render tự động bằng JavaScript -->
      </div>
      <p id="noResult" class="no-result" style="display: none">
        Không tìm thấy dòng iPhone phù hợp.
      </p>
    </main>

    <!-- Cửa sổ Giỏ hàng & Đặt hàng (Modal) -->
    <div id="cartModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Giỏ hàng của bạn</h2>
          <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>

        <div id="cartItems" class="cart-items">
          <!-- Danh sách iPhone đã chọn -->
        </div>

        <div class="cart-total">Tổng cộng: <span id="totalPrice">0₫</span></div>

        <!-- Form thông tin giao hàng -->
        <form
          id="checkoutForm"
          class="checkout-form"
          onsubmit="placeOrder(event)"
        >
          <h3>Thông tin giao hàng</h3>
          <input
            type="text"
            id="customerName"
            placeholder="Họ và tên người nhận"
            required
          />
          <input
            type="tel"
            id="customerPhone"
            placeholder="Số điện thoại liên hệ"
            required
          />
          <textarea
            id="customerAddress"
            rows="3"
            placeholder="Địa chỉ giao hàng chi tiết (Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố)"
            required
          ></textarea>
          <button type="submit" class="order-btn">Xác nhận đặt mua</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
